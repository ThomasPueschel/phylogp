# Builds the pkgdown website and deploys it to the gh-pages branch.
# The tutorial vignette fits Stan models, so CmdStan is installed (and cached).
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://stan-dev.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::cmdstanr, local::.
          needs: website

      - name: Cache CmdStan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-v1

      - name: Install CmdStan
        shell: Rscript {0}
        run: |
          if (!length(Sys.glob(path.expand("~/.cmdstan/cmdstan-*")))) {
            cmdstanr::install_cmdstan(cores = 4, quiet = TRUE)
          }
          cmdstanr::set_cmdstan_path(tail(sort(Sys.glob(path.expand("~/.cmdstan/cmdstan-*"))), 1))
          cmdstanr::cmdstan_version()

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
